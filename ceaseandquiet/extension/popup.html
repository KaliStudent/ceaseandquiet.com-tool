<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local vault</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head><body><main><h1>Cease <span>&amp;</span> Quiet</h1><p class="caption">LOCAL VAULT · PROTOTYPE</p><p id="state" role="status">Checking vault…</p><label>Passphrase<input id="passphrase" type="password" autocomplete="off" minlength="12"></label><div class="grid"><label>First name<input id="givenName" autocomplete="off"></label><label>Last name<input id="familyName" autocomplete="off"></label></div><label>Email<input id="email" type="email" autocomplete="off"></label><label>State or region<input id="region" autocomplete="off"></label><div class="buttons"><button id="save">Encrypt and save</button><button id="unlock">Unlock</button><button id="fill">Fill preview form</button><button id="erase">Erase vault</button></div><p class="fine">Fill requires an explicit click on the Cease &amp; Quiet preview. It never submits the form. Erase deletes the saved ciphertext; browser backups and copies already filled into a page are outside the vault.</p></main></body></html>
